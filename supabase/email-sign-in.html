<!--
  FullGrown's sign-in email, with the mark. Paste everything below this comment into Supabase:
  Authentication → Emails → Templates, into both "Magic Link" and "Confirm signup" (the first email to a new address
  uses Confirm signup). Suggested subject for both: Your FullGrown sign-in code

  {{ .Token }} is the code the app asks for; {{ .ConfirmationURL }} the link, which signs in on the device that
  asked (the app finishes it from the address). The mark is served by the website (fullgrown-site's email-mark.png):
  email apps don't show SVGs. Inline styles and a table layout, so it holds up in Gmail, Outlook and Apple Mail.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ede0c8;padding:24px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:460px;background:#f8f3e6;border:1px solid #d6c39b;border-radius:14px;">
        <tr>
          <td style="padding:28px 28px 8px 28px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding-right:12px;vertical-align:middle;"><img src="https://fullgrown.garden/email-mark.png" width="48" height="48" alt="" style="display:block;border:0;border-radius:11px;"></td>
                <td style="vertical-align:middle;font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:600;color:#1f2a22;">FullGrown</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 28px 0 28px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#1f2a22;">
            Your sign-in code:
          </td>
        </tr>
        <tr>
          <td style="padding:10px 28px 6px 28px;">
            <div style="font-family:'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:34px;font-weight:700;letter-spacing:6px;color:#2f5d3a;background:#ffffff;border:1px solid #d6c39b;border-radius:10px;padding:14px 18px;text-align:center;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:12px 28px 0 28px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:#1f2a22;">
            Type it into FullGrown where you asked for it. It works once.
          </td>
        </tr>
        <tr>
          <td style="padding:12px 28px 22px 28px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:#1f2a22;">
            Or, on the same device, <a href="{{ .ConfirmationURL }}" style="color:#2f5d3a;font-weight:600;">sign in with this link</a>.
          </td>
        </tr>
        <tr>
          <td style="padding:18px 28px 24px 28px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#4a4536;border-top:1px solid #e6d8bb;">
            If you didn't ask to sign in, you can ignore this email.<br>
            FullGrown · <a href="https://fullgrown.garden" style="color:#4a4536;">fullgrown.garden</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
