name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
      # The version shown in the app's menu: package.json's major.minor and the pull request's number
      # (0.2.049 for #49), from the event, or from main's merge commit ("Merge pull request #49 …", or a
      # squash's "… (#49)"). Anything else keeps package.json's.
      - name: Build
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          n="$PR_NUMBER"
          [ -n "$n" ] || n=$(git log -1 --format=%s | sed -n -e 's/^Merge pull request #\([0-9][0-9]*\).*/\1/p' -e 's/.*(#\([0-9][0-9]*\))$/\1/p' | head -1)
          if [ -n "$n" ]; then
            export APP_VERSION="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").$(printf %03d "$((10#$n))")"
          fi
          echo "Version: ${APP_VERSION:-from package.json}"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    # Publishes to GitHub Pages. Requires Settings → Pages → Source: "GitHub Actions".
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
